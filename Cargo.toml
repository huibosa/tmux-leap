[package]
name = "tmux-leap"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "tmux-leap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
semver = "1"
unicode-width = "0.1"
which = "6"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
tempfile = "3"
